<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Donaciones</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente similar a la de la imagen de referencia -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Barra de Navegación -->
    <header class="navbar">
        <div class="nav-left">
            <!-- Logo (puedes reemplazar la P por tu propio logo) -->
            <div class="logo">
                <span class="logo-icon">D</span>
            </div>
            <nav class="nav-links">
                <a href="#">Donantes <span class="arrow">v</span></a>
                <a href="#">Organizaciones <span class="arrow">v</span></a>
                <a href="#">Centros de acopio</a>
            </nav>
        </div>
        
        <div class="nav-right">
            <a href="#" class="nav-link-simple">Ayuda</a>
            <a href="login.html" class="btn btn-light">Iniciar sesión</a>
            <a href="registro.html" class="btn btn-dark">Registrarse</a>
        </div>
    </header>

    <!-- Sección Principal (Hero) -->
    <main class="hero-section">
        <div class="hero-content">
            <span class="badge">Donar</span>
            <h1 class="hero-title">El cambio comienza contigo.</h1>
            <p class="hero-subtitle">
                Apoya las causas en las que crees. Elige una organización benéfica a la que contribuir; nos aseguraremos de que tus donaciones lleguen.
            </p>
            <div class="hero-buttons">
                <a href="registro.html" class="btn btn-primary">Abre una cuenta</a>
                <a href="#info" class="btn btn-outline">Conoce el proceso</a>
            </div>
        </div>

        <div class="hero-image-container">
            <!-- La forma azul de fondo -->
            <div class="blue-shape"></div>
            <!-- La imagen principal con el recorte curvo -->
            <img src="https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Manos unidas en apoyo social" class="hero-img">
        </div>
    </main>

</body>
</html>
