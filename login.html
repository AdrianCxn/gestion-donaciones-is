<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma de Donaciones</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo"><span class="logo-icon">D</span></a>
        </div>
        <div class="nav-right">
            <a href="registro.html" class="btn btn-dark">Registrarse</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Acceso a la Plataforma</h2>
            <p class="auth-subtitle">Ingresa tus credenciales para gestionar o consultar donaciones.</p>

            <div id="error-msg" class="alert-box hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario / Entidad</label>
                    <input type="text" id="username" placeholder="admin_general" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
            </form>
            <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Abre una cuenta aquí</a></p>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-msg');
            errorBox.classList.add('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al autenticar');

                // Persistencia del JWT y datos de sesión en localStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('username', data.username);

                // Redirección física al panel de control
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
