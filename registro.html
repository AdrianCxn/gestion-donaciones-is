<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Plataforma de Donaciones</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo"><span class="logo-icon">D</span></a>
        </div>
        <div class="nav-right">
            <a href="login.html" class="btn btn-light">Iniciar sesión</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <p class="auth-subtitle">Regístrate como donante, organización social o administrador.</p>

            <div id="error-msg" class="alert-box hidden"></div>
            <div id="success-msg" class="alert-box alert-success hidden"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-username">Nombre de Usuario o Razón Social</label>
                    <input type="text" id="reg-username" placeholder="Empresa S.A." required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="reg-role">Tipo de Stakeholder</label>
                    <select id="reg-role" required>
                        <option value="donante">Empresa Donante</option>
                        <option value="organizacion">Organización Social</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Completar Registro</button>
            </form>
            <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-msg');
            const successBox = document.getElementById('success-msg');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al registrar');

                successBox.textContent = 'Registro exitoso. Redirigiendo al inicio de sesión...';
                successBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
