<main class="auth-container" data-page="login">
    <div class="auth-card">
        <h2>Accede a Givera</h2>
        <p class="auth-subtitle">Ingresa para gestionar o consultar donaciones.</p>
        <div id="error-msg" class="alert-box hidden"></div>
        <form id="login-form">
            <div class="form-group"><label for="username">Razón Social</label><input type="text" id="username" placeholder="Empresa S.A." required></div>
            <div class="form-group"><label for="password">Contraseña</label><input type="password" id="password" placeholder="••••••••" required></div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
        </form>
        <p class="auth-footer">¿No tienes cuenta? <a href="/registro.html">Abre una cuenta aquí</a></p>
    </div>
</main>
