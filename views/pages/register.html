<main class="auth-container" data-page="register">
    <div class="auth-card">
        <h2>Crea una cuenta</h2>
        <p class="auth-subtitle">Regístrate como empresa donante u organización social.</p>
        <div id="error-msg" class="alert-box hidden"></div>
        <div id="success-msg" class="alert-box alert-success hidden"></div>
        <div id="registration-paused" class="alert-box registration-paused hidden">Los registros no están disponibles mientras la presentación esté en curso.</div>
        <form id="register-form">
            <div class="form-group"><label for="reg-username">Razón Social</label><input type="text" id="reg-username" placeholder="Empresa S.A." required></div>
            <div class="form-group"><label for="reg-password">Contraseña</label><input type="password" id="reg-password" placeholder="••••••••" required></div>
            <div class="form-group"><label for="reg-role">¿Cómo participarás?</label><select id="reg-role" required><option value="" disabled selected>Selecciona una opción</option><option value="donante">Soy una empresa donante</option><option value="organizacion">Represento una organización social</option></select></div>
            <button type="submit" class="btn btn-primary btn-block">Completar registro</button>
        </form>
        <p class="auth-footer">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </div>
</main>
